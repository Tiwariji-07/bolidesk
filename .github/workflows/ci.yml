name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bolidesk
          POSTGRES_PASSWORD: bolidesk
          POSTGRES_DB: bolidesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bolidesk -d bolidesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bolidesk:bolidesk@127.0.0.1:5432/bolidesk?schema=public
      TEST_DATABASE_URL: postgresql://bolidesk:bolidesk@127.0.0.1:5432/bolidesk_test?schema=public
      SESSION_SECRET: ci-session-secret-with-at-least-thirty-two-characters
      DEMO_USER_PASSWORD: ci-demo-password-1234
      DEMO_MODE: "true"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Database tests (Postgres)
        run: npm run test:db
      - run: npm run env:check
      - run: npm run build
      - name: Migrate and seed the demo shop
        run: npm run db:deploy && npm run db:seed
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
