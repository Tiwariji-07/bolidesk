services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bolidesk
      POSTGRES_USER: bolidesk
      POSTGRES_PASSWORD: bolidesk
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolidesk -d bolidesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    environment:
      DATABASE_URL: postgresql://bolidesk:bolidesk@db:5432/bolidesk?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://bolidesk:bolidesk@db:5432/bolidesk?schema=public
      DEMO_MODE: "true"
      APP_URL: http://localhost:3000
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
